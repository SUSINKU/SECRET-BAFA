  font-family:Poppins,"Segoe UI",system-ui,sans-serif;
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.wrap { max-width:620px; margin:0 auto; padding:0 16px 72px; }
.hidden { display:none !important; }
.muted { color:var(--muted); font-size:.9rem; }
p { margin:8px 0; }

/* ═════════════════════════════════ le ciel ════════════════════════════ */
.hero {
  position:relative; overflow:hidden; background:var(--ciel);
  border-radius:0 0 30px 30px; padding:18px 20px 26px; color:var(--blanc);
  box-shadow:0 10px 34px rgba(120,60,160,.28);
}
.hero__blobs { position:absolute; inset:0; pointer-events:none; }
.hero__blobs i {
  position:absolute; display:block; border-radius:50%; filter:blur(34px); opacity:.5;
}
.hero__blobs i:nth-child(1) { width:190px; height:190px; background:#FFD3A8; right:-52px; top:-58px; }
.hero__blobs i:nth-child(2) { width:170px; height:170px; background:#A78BFA; left:-58px; bottom:-72px; }
.hero__inner { position:relative; max-width:588px; margin:0 auto; }

.brand { display:flex; align-items:center; gap:9px; font-weight:800; font-size:1.05rem; letter-spacing:-.01em; }
.brand__mark {
  width:30px; height:30px; flex:0 0 30px; border-radius:10px; display:grid; place-items:center;
  background:rgba(255,255,255,.24); font-size:.95rem;
}
.hero__pill {
  display:inline-block; margin-top:14px; padding:6px 15px; border-radius:999px;
  background:rgba(255,255,255,.22); font-size:.78rem; font-weight:600; letter-spacing:.01em;
  backdrop-filter:blur(4px);
}
.hero h1 {
  margin:10px 0 0; font-size:clamp(1.5rem,6.4vw,2rem); font-weight:800;
  line-height:1.14; letter-spacing:-.02em; text-wrap:balance;
}
.hero__sub { margin:8px 0 0; font-size:.97rem; font-weight:500; color:rgba(255,255,255,.93); max-width:38ch; }

.hero__stats { display:flex; gap:9px; margin-top:18px; flex-wrap:wrap; }
.stat {
  background:var(--blanc); border-radius:15px; padding:9px 13px; box-shadow:var(--ombre);
  flex:1 1 0; min-width:94px; animation:bob 6s ease-in-out infinite;
}
.stat:nth-child(2) { animation-delay:-2s; }
.stat:nth-child(3) { animation-delay:-4s; }
.stat b { display:block; font-size:1.22rem; font-weight:800; color:var(--encre); line-height:1.15;
  font-variant-numeric:tabular-nums; }
.stat span { display:block; font-size:.68rem; font-weight:600; color:var(--muted);
  text-transform:uppercase; letter-spacing:.06em; }
@keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-3px); } }

.progress { margin-top:14px; }
.progress__track { height:8px; border-radius:999px; background:rgba(255,255,255,.3); overflow:hidden; }
.progress__fill { height:100%; border-radius:999px; background:var(--blanc);
  transition:width .8s cubic-bezier(.3,1,.4,1); }
.progress__label { font-size:.72rem; font-weight:600; margin-top:6px; color:rgba(255,255,255,.9); }

/* ═════════════════════════════════ onglets ════════════════════════════ */
nav.tabs {
  position:sticky; top:0; z-index:20; display:flex; gap:5px; overflow-x:auto;
  padding:10px 16px; background:rgba(247,244,251,.94); backdrop-filter:blur(9px);
  scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent);
          mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent);
}
nav.tabs::-webkit-scrollbar { display:none; }
nav.tabs button {
  flex:0 0 auto; border:0; font:inherit; font-weight:600; font-size:.86rem;
  padding:8px 15px; border-radius:999px; cursor:pointer;
  background:var(--blanc); color:var(--encre-douce); box-shadow:0 2px 7px rgba(80,40,120,.09);
  transition:transform .16s, box-shadow .16s;
}
nav.tabs button:hover { transform:translateY(-1px); }
nav.tabs button[aria-selected="true"] {
  background:var(--feu); color:var(--blanc); box-shadow:0 6px 16px rgba(239,90,111,.36);
}

/* ═════════════════════════════════ cartes ═════════════════════════════ */
.card {
  background:var(--blanc); border-radius:var(--r); padding:20px; margin:16px 0;
  box-shadow:var(--ombre); animation:rise .42s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
.card h2 { margin:0 0 12px; font-size:1.12rem; font-weight:800; letter-spacing:-.01em; }
h3 { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.1em;
  color:var(--muted); margin:22px 0 8px; }

.banner { border-radius:var(--r-sm); padding:12px 15px; margin:16px 0; font-weight:600; font-size:.93rem; }
.banner.info { background:var(--voile); color:var(--indigo); }
.banner.warn { background:var(--alerte-doux); color:var(--alerte); }
.banner.good { background:var(--bon-doux); color:var(--bon); }
.banner.bad { background:var(--rate-doux); color:var(--rate); }

/* ═══════════════════════════════ formulaires ══════════════════════════ */
label { display:block; font-weight:600; margin:15px 0 6px; font-size:.9rem; color:var(--encre-douce); }
input, textarea, select {
  width:100%; padding:12px 14px; font:inherit; color:var(--encre);
  background:var(--sol); border:2px solid transparent; border-radius:var(--r-sm);
  transition:border-color .18s, background .18s;
}
input:focus, textarea:focus, select:focus {
  outline:none; border-color:var(--violet); background:var(--blanc);
}
textarea { min-height:112px; resize:vertical; line-height:1.5; }

button.btn {
  font:inherit; font-weight:700; font-size:.95rem; padding:13px 24px; border:0;
  border-radius:999px; background:var(--feu); color:var(--blanc); cursor:pointer;
  margin-top:16px; box-shadow:0 8px 20px rgba(239,90,111,.34);
  transition:transform .16s, box-shadow .16s, opacity .16s;
}
button.btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 12px 26px rgba(239,90,111,.42); }
button.btn:active:not(:disabled) { transform:translateY(0); }
button.btn:disabled { opacity:.42; cursor:not-allowed; box-shadow:none; }
button.btn.full { width:100%; }
button.btn.ghost {
  background:var(--voile); color:var(--indigo); box-shadow:none;
}
button.btn.ghost:hover:not(:disabled) { box-shadow:0 6px 16px rgba(108,92,231,.22); }
button.btn.bad { background:var(--rate); box-shadow:0 8px 20px rgba(224,69,92,.3); }
button.btn.small { padding:8px 16px; font-size:.82rem; margin-top:8px; box-shadow:none; }
.row { display:flex; flex-wrap:wrap; gap:9px; }

.msg { margin-top:13px; padding:11px 14px; border-radius:var(--r-sm); font-size:.9rem; font-weight:600; }
.msg.error { background:var(--rate-doux); color:var(--rate); }
.msg.ok { background:var(--bon-doux); color:var(--bon); }

/* ═════════════════════════════════ secrets ════════════════════════════ */
.secret {
  display:block; width:100%; text-align:left; font:inherit; color:inherit; position:relative;
  background:var(--blanc); border:2px solid var(--ligne); border-radius:var(--r);
  padding:14px 16px; margin:11px 0; cursor:pointer; box-shadow:var(--ombre);
  transform:rotate(-.5deg);
  transition:transform .22s cubic-bezier(.34,1.4,.64,1), box-shadow .22s, border-color .22s;
}
.secret:nth-of-type(even) { transform:rotate(.6deg); }
.secret:hover { transform:rotate(0) translateY(-3px); box-shadow:var(--ombre-forte); }
.secret.flat { cursor:default; }
.secret[aria-pressed="true"] {
  transform:rotate(0) translateY(-3px); border-color:var(--violet);
  box-shadow:0 0 0 4px rgba(139,92,246,.16), var(--ombre-forte);
}
.secret .code {
  display:inline-block; font-size:.66rem; font-weight:800; letter-spacing:.12em;
  text-transform:uppercase; color:var(--indigo); background:var(--voile);
  padding:3px 9px; border-radius:999px;
}
.secret .txt { display:block; margin-top:8px; white-space:pre-wrap; overflow-wrap:anywhere;
  font-weight:500; line-height:1.5; }
.secret .who { display:block; margin-top:10px; font-weight:700; font-size:.9rem; color:var(--bon); }
.secret.solved { border-color:var(--bon); background:linear-gradient(180deg,#F4FCF9,#fff); }
.secret.mine { border-style:dashed; border-color:var(--violet); }

/* ═════════════════════════════════ reveal ═════════════════════════════ */
.stamp {
  position:absolute; top:-11px; right:-6px; padding:6px 13px; border-radius:999px;
  background:var(--feu); color:var(--blanc); font-size:.68rem; font-weight:800;
  text-transform:uppercase; letter-spacing:.07em; box-shadow:0 6px 15px rgba(239,90,111,.4);
  animation:land .58s cubic-bezier(.2,1.7,.4,1) both;
}
@keyframes land {
  0% { transform:rotate(-40deg) scale(2.3); opacity:0; }
  65% { transform:rotate(7deg) scale(.93); opacity:1; }
  100% { transform:rotate(3deg) scale(1); opacity:1; }
}
.confetti { position:fixed; inset:0; pointer-events:none; z-index:60; overflow:hidden; }
.confetti i {
  position:absolute; top:-14px; width:9px; height:14px; border-radius:2px;
  animation:fall 2.4s cubic-bezier(.25,.6,.5,1) forwards;
}
@keyframes fall {
  0% { transform:translateY(-20px) rotate(0); opacity:1; }
  100% { transform:translateY(105vh) rotate(680deg); opacity:0; }
}

/* ═══════════════════════════════ classement ═══════════════════════════ */
.rank {
  display:flex; align-items:center; gap:13px; background:var(--blanc);
  border-radius:var(--r); padding:12px 15px; margin:9px 0; box-shadow:var(--ombre);
  animation:rise .4s cubic-bezier(.2,.9,.3,1) both;
}
.rank .pos {
  width:34px; height:34px; flex:0 0 34px; display:grid; place-items:center; border-radius:12px;
  background:var(--voile); color:var(--indigo); font-weight:800; font-size:.92rem;
}
.rank.p1 .pos { background:var(--feu); color:var(--blanc); }
.rank.p2 .pos { background:linear-gradient(95deg,#B49BE8,#8B5CF6); color:var(--blanc); }
.rank.p3 .pos { background:linear-gradient(95deg,#FFC38B,#F79B4B); color:var(--blanc); }
.rank .who { flex:1; font-weight:700; overflow-wrap:anywhere; line-height:1.3; }
.rank .who small { display:block; font-weight:500; color:var(--muted); font-size:.75rem; }
.rank .pts { font-weight:800; font-size:1.05rem; color:var(--corail); font-variant-numeric:tabular-nums; }
.rank.me { box-shadow:0 0 0 2px var(--violet), var(--ombre); }

/* ═══════════════════════════════ résultats ════════════════════════════ */
.vote {
  background:var(--blanc); border-radius:var(--r-sm); padding:13px 15px; margin:10px 0;
  box-shadow:var(--ombre); border-left:5px solid var(--rate);
  animation:rise .4s cubic-bezier(.2,.9,.3,1) both;
}
.vote.hit { border-left-color:var(--bon); }
.vote p { margin:0 0 6px; font-weight:600; font-size:.95rem; }
.vote p.muted { font-weight:400; font-style:italic; }
.pill {
  display:inline-block; font-size:.73rem; font-weight:700; padding:4px 11px; border-radius:999px;
  background:var(--bon-doux); color:var(--bon);
}
.pill.bad { background:var(--rate-doux); color:var(--rate); }
.pill.grey { background:var(--voile); color:var(--muted); }

table { width:100%; border-collapse:collapse; font-size:.92rem; }
th, td { text-align:left; padding:9px 4px; border-bottom:1px solid var(--ligne); }
th { color:var(--muted); font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
td { font-weight:600; font-variant-numeric:tabular-nums; }

footer { text-align:center; color:var(--muted); font-size:.8rem; padding:6px 16px 40px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.001ms !important; transition-duration:.001ms !important; }
}
</style>

<header class="hero" id="hero">
  <div class="hero__blobs" aria-hidden="true"><i></i><i></i></div>
  <div class="hero__inner">
    <div class="brand"><span class="brand__mark">🤫</span><span id="gameName">Secret BAFA</span></div>
    <div class="hero__pill" id="statusLine">Connexion…</div>
    <h1 id="heroTitle"></h1>
    <p class="hero__sub" id="heroSub"></p>
    <div class="hero__stats" id="heroStats"></div>
    <div class="progress hidden" id="heroProgress">
      <div class="progress__track"><div class="progress__fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress__label" id="progressLabel"></div>
    </div>
  </div>
</header>

<nav class="tabs hidden" id="tabs"></nav>

<main class="wrap">
  <div id="boot" class="card">
    <h2>Chargement…</h2>
    <p class="muted">Le jeu se connecte à sa base partagée.</p>
  </div>
  <div id="screen"></div>
</main>

<footer>Un secret, ça reste dans la formation.</footer>

<script>
"use strict";

/* ═══════════════════════════════════════════════════ petites aides ════ */
const $ = (id) => document.getElementById(id);
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); return n; }
function plural(n, one, many) { return n + " " + (n > 1 ? many : one); }
function say(box, text, kind) {
  const n = typeof box === "string" ? $(box) : box;
  if (!n) return;
  clear(n);
  if (!text) return;
  n.appendChild(el("div", "msg " + (kind || "error"), text));
}

/** Clé de joueur : le prénom, sans accents ni espaces — sert d'identifiant. */
function nameKey(name) {
  return String(name || "").trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
}
async function hashPassword(password, salt) {
  const bytes = new TextEncoder().encode(salt + "::" + password);
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  return [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
function randomId(n) {
  const bytes = crypto.getRandomValues(new Uint8Array(n || 8));
  return [...bytes].map((b) => b.toString(16).padStart(2, "0")).join("");
}
const CODE_LETTERS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function secretCode() {
  const bytes = crypto.getRandomValues(new Uint8Array(3));
  return [...bytes].map((b) => CODE_LETTERS[b % CODE_LETTERS.length]).join("");
}

/* ═══════════════════════════════════════════════════════ mémoire ═════ */
const LS_PLAYER = "secret-bafa.player";
const LS_ANIM = "secret-bafa.anim";
function remember(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
function recall(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function forget(key) { try { localStorage.removeItem(key); } catch (e) {} }

/* ═══════════════════════════════════════════════════════ état ════════ */
let db = null;
const S = {
  ready: false,
  game: null,
  players: new Map(),   // key -> {name, key, bonus}
  secrets: new Map(),   // key -> {owner, text, code, sortKey, solvedDay}
  votes: [],            // {day, voter, secret, guess}
  meKey: recall(LS_PLAYER),
  isAnim: false,
  view: "secret",
  pick: null,
  pickWho: "",
};

const DEFAULT_GAME = {
  name: "Secret BAFA",
  phase: "lobby",
  day: 0,
  roundStatus: null,
  pointsCorrect: 3,
  pointsWrong: 1,
  animSalt: "",
  animHash: "",
};

const me = () => (S.meKey ? S.players.get(S.meKey) || null : null);
const mySecret = () => (S.meKey ? S.secrets.get(S.meKey) || null : null);
const game = () => S.game || DEFAULT_GAME;

/* ═══════════════════════════════════════════════════════ scores ══════ */
function leaderboard() {
  const g = game();
  const closed = new Set();
  for (const v of S.votes) if (v.day < g.day || g.roundStatus === "closed") closed.add(v.day);

  const rows = new Map();
  for (const [key, p] of S.players) {
    rows.set(key, { key: key, name: p.name, found: 0, fooled: 0, points: p.bonus || 0 });
  }
  for (const v of S.votes) {
    if (!closed.has(v.day)) continue;
    const secret = S.secrets.get(v.secret);
    if (!secret) continue;
    if (v.guess === secret.owner) {
      const voter = rows.get(v.voter);
      if (voter) { voter.found += 1; voter.points += g.pointsCorrect; }
    } else {
      const author = rows.get(secret.owner);
      if (author) { author.fooled += 1; author.points += g.pointsWrong; }
    }
  }
  return [...rows.values()].sort((a, b) =>
    b.points - a.points || b.found - a.found || a.name.localeCompare(b.name, "fr"));
}

/** Les journées dont les votes sont publics : toutes celles déjà closes. */
function revealedDays() {
  const g = game();
  const days = [];
  for (let d = 1; d <= g.day; d += 1) {
    if (d < g.day || g.roundStatus === "closed") days.push(d);
  }
  return days.reverse();
}
function votesOfDay(day) { return S.votes.filter((v) => v.day === day); }
function myVote(day) { return S.votes.find((v) => v.day === day && v.voter === S.meKey) || null; }

/** Secrets encore en jeu, dans un ordre stable qui ne trahit pas l'ordre de dépôt. */
function secretsInOrder() {
  return [...S.secrets.values()].sort((a, b) => String(a.sortKey).localeCompare(String(b.sortKey)));
}
function suspects() {
  return [...S.players.values()]
    .filter((p) => {
      const s = S.secrets.get(p.key);
      return s && s.solvedDay == null && p.key !== S.meKey;
    })
    .sort((a, b) => a.name.localeCompare(b.name, "fr"));
}

/* ═══════════════════════════════════════════════════ connexion db ════ */
async function boot() {
  db = (window.claude && typeof window.claude.use === "function")
    ? await window.claude.use("db")
    : null;
  if (!db) {
    $("statusLine").textContent = "Hors ligne";
    clear($("boot")).appendChild(el("h2", null, "Base de données indisponible"));
    $("boot").appendChild(el("p", "muted",
      "Cette page a besoin de sa base partagée pour faire jouer plusieurs personnes ensemble. " +
      "Ouvre-la depuis claude.ai en étant connecté·e, puis recharge."));
    return;
  }

  db.doc("game/state").onSnapshot((snap) => {
    S.game = snap.exists ? Object.assign({}, DEFAULT_GAME, snap.data()) : null;
    S.ready = true;
    render();
  }, onDbError);

  db.collection("players").onSnapshot((snap) => {
    S.players = new Map();
    for (const doc of snap.docs) {
      const d = doc.data();
      S.players.set(doc.id, { key: doc.id, name: d.name, bonus: d.bonus || 0 });
    }
    render();
  }, onDbError);

  db.collection("secrets").onSnapshot((snap) => {
    S.secrets = new Map();
    for (const doc of snap.docs) {
      const d = doc.data();
      S.secrets.set(doc.id, {
        owner: doc.id, text: d.text, code: d.code,
        sortKey: d.sortKey, solvedDay: d.solvedDay == null ? null : d.solvedDay,
      });
    }
    render();
  }, onDbError);

  db.collection("votes").onSnapshot((snap) => {
    S.votes = snap.docs.map((doc) => {
      const d = doc.data();
      return { day: d.day, voter: d.voter, secret: d.secret, guess: d.guess };
    });
    render();
  }, onDbError);
}
function onDbError(e) {
  $("statusLine").textContent = "Connexion perdue — recharge la page.";
  console.error("db", e);
}

/* ═══════════════════════════════════════════════════════ actions ═════ */
async function ensureGame() {
  if (S.game) return S.game;
  await db.doc("game/state").set(DEFAULT_GAME);
  return DEFAULT_GAME;
}

async function register(name, password) {
  const clean = String(name || "").trim().replace(/\s+/g, " ");
  if (clean.length < 2) throw new Error("Ton prénom doit faire au moins 2 caractères.");
  if (clean.length > 30) throw new Error("Ton prénom est trop long (30 caractères max).");
  const key = nameKey(clean);
  if (!key) throw new Error("Ce prénom ne contient aucune lettre utilisable.");
  if (String(password || "").length < 4) throw new Error("Le mot de passe doit faire au moins 4 caractères.");

  // On pose un verrou court le temps de vérifier puis d'écrire, sinon deux
  // personnes qui s'inscrivent en même temps sous le même prénom se marchent dessus.
  const ref = db.doc("players/" + key);
  const lease = await ref.acquire({ holder: randomId(6), ttlMs: 8000 });
  if (!lease.acquired) throw new Error("Quelqu'un s'inscrit avec ce prénom à l'instant. Réessaie.");
  const existing = await ref.get();
  if (existing.exists && existing.data().pwHash) {
    throw new Error("Ce prénom est déjà pris. Ajoute une initiale, par exemple « Camille B. ».");
  }
  const salt = randomId(8);
  await ref.set({ name: clean, salt: salt, pwHash: await hashPassword(password, salt), bonus: 0 });
  await ensureGame();
  S.meKey = key;
  remember(LS_PLAYER, key);
}

async function login(name, password) {
  const key = nameKey(name);
  const snap = await db.doc("players/" + key).get();
  if (!snap.exists) throw new Error("Aucun compte à ce prénom.");
  const d = snap.data();
  if (await hashPassword(password, d.salt) !== d.pwHash) throw new Error("Mot de passe incorrect.");
  S.meKey = key;
  remember(LS_PLAYER, key);
}

async function saveSecret(text) {
  const clean = String(text || "").trim();
  if (clean.length < 10) throw new Error("Ton secret doit faire au moins 10 caractères.");
  if (clean.length > 400) throw new Error("Ton secret ne doit pas dépasser 400 caractères.");
  if (game().phase !== "lobby") throw new Error("La partie a commencé : les secrets sont verrouillés.");
  const old = mySecret();
  await db.doc("secrets/" + S.meKey).set({
    text: clean,
    code: old ? old.code : secretCode(),
    sortKey: old ? old.sortKey : randomId(6),
    solvedDay: null,
  });
}

async function castVote(secretKey, guessKey) {
  const g = game();
  if (g.phase !== "jeu" || g.roundStatus !== "open") throw new Error("Aucune journée de vote n'est ouverte.");
  if (!mySecret()) throw new Error("Tu dois avoir déposé ton secret pour voter.");
  if (myVote(g.day)) throw new Error("Tu as déjà voté aujourd'hui.");
  const secret = S.secrets.get(secretKey);
  if (!secret) throw new Error("Ce secret n'existe plus.");
  if (secret.owner === S.meKey) throw new Error("Tu ne peux pas voter sur ton propre secret.");
  if (secret.solvedDay != null) throw new Error("Ce secret a déjà été démasqué.");
  if (guessKey === S.meKey) throw new Error("Tu ne peux pas t'accuser toi-même.");
  const guessed = S.secrets.get(guessKey);
  if (!guessed) throw new Error("Cette personne n'a pas déposé de secret.");
  if (guessed.solvedDay != null) throw new Error("Le secret de cette personne est déjà trouvé : elle n'est plus suspecte.");

  await db.doc("votes/" + g.day + "-" + S.meKey).set({
    day: g.day, voter: S.meKey, secret: secretKey, guess: guessKey,
  });
}

/* ------------------------------------------------------------ animateur */
async function animLogin(password) {
  const g = await ensureGame();
  if (!g.animHash) {
    const salt = randomId(8);
    await db.doc("game/state").update({ animSalt: salt, animHash: await hashPassword(password, salt) });
    S.isAnim = true;
    remember(LS_ANIM, "1");
    return "Mot de passe animateur défini. Garde-le : il protège la clôture des journées.";
  }
  if (await hashPassword(password, g.animSalt) !== g.animHash) throw new Error("Mot de passe animateur incorrect.");
  S.isAnim = true;
  remember(LS_ANIM, "1");
  return "";
}

async function startGame() {
  if (S.secrets.size < 3) throw new Error("Il faut au moins 3 secrets déposés pour lancer la partie.");
  await db.doc("game/state").update({ phase: "jeu", day: 1, roundStatus: "open" });
}

async function closeDay() {
  const g = game();
  if (g.roundStatus !== "open") throw new Error("Aucune journée ouverte.");
  // Un secret deviné juste par au moins une personne sort du jeu.
  const found = new Set();
  for (const v of votesOfDay(g.day)) {
    const secret = S.secrets.get(v.secret);
    if (secret && secret.solvedDay == null && v.guess === secret.owner) found.add(secret.owner);
  }
  for (const owner of found) await db.doc("secrets/" + owner).update({ solvedDay: g.day });

  const remaining = [...S.secrets.values()].filter((s) => s.solvedDay == null && !found.has(s.owner));
  await db.doc("game/state").update({
    roundStatus: "closed",
    phase: remaining.length === 0 ? "fini" : "jeu",
  });
}

async function openNextDay() {
  const g = game();
  if (g.phase === "fini") throw new Error("La partie est terminée.");
  if (g.roundStatus === "open") throw new Error("Une journée est déjà ouverte.");
  await db.doc("game/state").update({ day: g.day + 1, roundStatus: "open" });
}

async function endGame() {
  if (game().roundStatus === "open") await closeDay();
  await db.doc("game/state").update({ phase: "fini" });
}

async function setRules(patch) { await db.doc("game/state").update(patch); }

async function removePlayer(key) {
  await db.doc("secrets/" + key).delete().catch(() => {});
  for (const v of S.votes.filter((v) => v.voter === key)) {
    await db.doc("votes/" + v.day + "-" + v.voter).delete().catch(() => {});
  }
  await db.doc("players/" + key).delete();
}

async function resetGame(keepPlayers) {
  for (const v of S.votes) await db.doc("votes/" + v.day + "-" + v.voter).delete().catch(() => {});
  if (keepPlayers) {
    for (const key of S.secrets.keys()) await db.doc("secrets/" + key).update({ solvedDay: null });
    for (const key of S.players.keys()) await db.doc("players/" + key).update({ bonus: 0 });
  } else {
    for (const key of S.secrets.keys()) await db.doc("secrets/" + key).delete().catch(() => {});
    for (const key of S.players.keys()) await db.doc("players/" + key).delete().catch(() => {});
    forget(LS_PLAYER);
    S.meKey = null;
  }
  await db.doc("game/state").update({ phase: "lobby", day: 0, roundStatus: null });
}

/* ═══════════════════════════════════════════════════════ rendu ═══════ */
const TABS = [
  ["secret", "Mon secret"], ["vote", "Voter"], ["secrets", "Les secrets"],
  ["results", "Résultats"], ["ranking", "Classement"], ["anim", "Animateur"],
];

function phaseText() {
  const g = game();
  if (!S.game) return "Aucune partie — la première inscription la crée.";
  if (g.phase === "lobby") return "Inscriptions ouvertes · dépôt des secrets";
  if (g.phase === "fini") return "Partie terminée";
  if (g.roundStatus === "open") return "Journée " + g.day + " · votes ouverts";
  return "Journée " + g.day + " · votes révélés";
}

let renderPending = false;
function isTyping() {
  const a = document.activeElement;
  return !!a && $("screen").contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
}
document.addEventListener("focusout", () => {
  if (renderPending) { renderPending = false; setTimeout(() => render(true), 0); }
});

function render(force) {
  if (!S.ready) return;
  if (!force && isTyping()) { renderPending = true; return; }
  $("boot").classList.add("hidden");
  $("gameName").textContent = game().name;
  $("statusLine").textContent = phaseText();
  renderHero();

  if (!me()) { S.view = "login"; renderTabs(false); return renderLogin(); }
  if (S.view === "login" || !TABS.some(([id]) => id === S.view)) S.view = "secret";
  renderTabs(true);

  const screen = clear($("screen"));
  if (S.view === "secret") renderMySecret(screen);
  else if (S.view === "vote") renderVote(screen);
  else if (S.view === "secrets") renderSecrets(screen);
  else if (S.view === "results") renderResults(screen);
  else if (S.view === "ranking") renderRanking(screen);
  else if (S.view === "anim") renderAnim(screen);
}

function renderTabs(show) {
  const tabs = $("tabs");
  tabs.classList.toggle("hidden", !show);
  if (!show) return clear(tabs);
  clear(tabs);
  for (const [id, label] of TABS) {
    const b = el("button", null, label);
    b.setAttribute("aria-selected", String(S.view === id));
    b.onclick = () => { S.view = id; render(true); window.scrollTo({ top: 0 }); };
    tabs.appendChild(b);
  }
}

/** Le titre du ciel dit toujours ce que le joueur a à faire maintenant. */
function heroCopy() {
  const g = game();
  if (!me()) {
    return { title: "Un secret. Un vote par jour.", sub: "Le jeu des secrets de ta formation." };
  }
  const secret = mySecret();
  if (g.phase === "lobby") {
    return secret
      ? { title: "Ton secret est sous clé", sub: "On attend que l'animateur lance la partie." }
      : { title: "Dépose ton secret", sub: "La partie ne peut pas commencer sans toi." };
  }
  if (g.phase === "fini") {
    const top = leaderboard()[0];
    return top
      ? { title: top.name + " l'emporte !", sub: top.points + " points. Tous les secrets sont révélés." }
      : { title: "Partie terminée", sub: "Tous les secrets sont révélés." };
  }
  if (g.roundStatus === "open") {
    return myVote(g.day)
      ? { title: "Vote enregistré", sub: "Rendez-vous au reveal de ce soir." }
      : { title: "À toi de jouer", sub: "Un seul vote aujourd'hui, et il est définitif." };
  }
  return { title: "Les votes sont tombés", sub: "Journée " + g.day + " révélée. La suivante ouvrira bientôt." };
}

function statChip(value, label) {
  const chip = el("div", "stat");
  chip.appendChild(el("b", null, String(value)));
  chip.appendChild(el("span", null, label));
  return chip;
}

function renderHero() {
  const g = game();
  const copy = heroCopy();
  $("heroTitle").textContent = copy.title;
  $("heroSub").textContent = copy.sub;

  const stats = clear($("heroStats"));
  const total = S.secrets.size;
  const solved = [...S.secrets.values()].filter((x) => x.solvedDay != null).length;

  if (!me() || g.phase === "lobby") {
    stats.appendChild(statChip(S.players.size, S.players.size > 1 ? "inscrits" : "inscrit"));
    stats.appendChild(statChip(total, total > 1 ? "secrets" : "secret"));
  } else {
    stats.appendChild(statChip("J" + g.day, "journée"));
    if (g.roundStatus === "open") {
      stats.appendChild(statChip(votesOfDay(g.day).length + "/" + total, "ont voté"));
    } else {
      stats.appendChild(statChip(votesOfDay(g.day).length, "votes"));
    }

  }

  const bar = $("heroProgress");

  bar.classList.toggle("hidden", !show);

    $("progressFill").style.width = Math.round((solved / total) * 100) + "%";
    $("progressLabel").textContent = solved + " secret" + (solved > 1 ? "s" : "") +
      " démasqué" + (solved > 1 ? "s" : "") + " sur " + total;
  }
}

/** Petite pluie de confettis quand tu as trouvé juste. Une fois par journée. */
const celebrated = new Set();
function celebrate(day) {
  if (celebrated.has(day)) return;
  celebrated.add(day);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const sky = el("div", "confetti");
  const colors = ["#EF5A6F", "#F79B4B", "#8B5CF6", "#E8629B", "#FFB884", "#6C5CE7"];
  for (let i = 0; i < 28; i += 1) {
    const bit = document.createElement("i");
    bit.style.left = Math.random() * 100 + "%";
    bit.style.background = colors[i % colors.length];
    bit.style.animationDelay = (Math.random() * 0.5).toFixed(2) + "s";
    bit.style.animationDuration = (1.9 + Math.random() * 1.1).toFixed(2) + "s";
    sky.appendChild(bit);
  }
  document.body.appendChild(sky);
  setTimeout(() => sky.remove(), 3400);
}

/* --------------------------------------------------------------- vote */
function renderVote(screen) {
  const g = game();
  const card = el("div", "card");
  card.appendChild(el("h2", null, "Mon vote du jour"));

  if (g.phase === "lobby") {
    card.appendChild(el("p", "muted", "Les votes ouvriront quand l'animateur lancera la partie."));
    return screen.appendChild(card);
  }
  if (g.phase === "fini") {
    card.appendChild(el("p", "muted", "La partie est terminée : va voir le classement final."));
    return screen.appendChild(card);
  }
  if (g.roundStatus !== "open") {
    card.appendChild(el("p", "muted", "La journée " + g.day + " est close. Attends l'ouverture de la suivante."));
    return screen.appendChild(card);
  }
  if (!mySecret()) {
    card.appendChild(el("p", "muted", "Tu n'as pas déposé de secret : tu ne peux pas voter."));
    return screen.appendChild(card);
  }

  const mine = myVote(g.day);
  if (mine) {
    const secret = S.secrets.get(mine.secret);
    const who = S.players.get(mine.guess);
    card.appendChild(el("p", null, "Tu as voté pour la journée " + g.day + " :"));
    const box = el("div", "secret flat");
    box.appendChild(el("span", "code", "Secret " + (secret ? secret.code : "?")));
    box.appendChild(el("span", "txt", secret ? secret.text : ""));
    box.appendChild(el("span", "who", "Ta réponse : " + (who ? who.name : "?")));
    card.appendChild(box);
    card.appendChild(el("p", "muted", "Un seul vote par jour, impossible de le changer."));
    return screen.appendChild(card);
  }

  const votable = secretsInOrder().filter((s) => s.solvedDay == null && s.owner !== S.meKey);
  const who = suspects();
  if (!votable.length || !who.length) {
    card.appendChild(el("p", "muted", "Aucun secret à deviner pour le moment."));
    return screen.appendChild(card);
  }

  card.appendChild(el("p", "muted",
    "Journée " + g.day + " — " + plural(votable.length, "secret à percer", "secrets à percer") + ". Tu n'as qu'un vote."));
  card.appendChild(el("h3", null, "1. Choisis un secret"));
  for (const s of votable) {
    const btn = el("button", "secret");
    btn.type = "button";
    btn.setAttribute("aria-pressed", String(S.pick === s.owner));
    btn.appendChild(el("span", "code", "Secret " + s.code));
    btn.appendChild(el("span", "txt", s.text));
    btn.onclick = () => { S.pick = s.owner; render(true); };
    card.appendChild(btn);
  }

  card.appendChild(el("h3", null, "2. Qui l'a écrit ?"));
  const select = document.createElement("select");
  const none = el("option", null, "— Choisir une personne —"); none.value = "";
  select.appendChild(none);
  for (const p of who) {
    const o = el("option", null, p.name); o.value = p.key;
    select.appendChild(o);
  }
  select.value = who.some((p) => p.key === S.pickWho) ? S.pickWho : "";
  select.onchange = () => { S.pickWho = select.value; };
  card.appendChild(select);

  const btn = el("button", "btn full", "Valider mon vote (définitif)");
  btn.onclick = async () => {
    say("voteMsg", "");
    if (!S.pick) return say("voteMsg", "Choisis d'abord un secret.");
    if (!select.value) return say("voteMsg", "Choisis la personne que tu accuses.");
    const s = S.secrets.get(S.pick);
    const p = S.players.get(select.value);
    if (!confirm("Tu accuses " + p.name + " d'avoir écrit le secret " + s.code +
                 ".\n\nC'est ton seul vote de la journée et il est définitif. On valide ?")) return;
    btn.disabled = true;
    try { S.pick = null; S.pickWho = ""; await castVote(s.owner, p.key); }
    catch (err) { say("voteMsg", err.message); btn.disabled = false; }
  };
  card.appendChild(btn);
  const msg = el("div"); msg.id = "voteMsg"; card.appendChild(msg);
  screen.appendChild(card);
}

/* ---------------------------------------------------------- résultats */
function renderResults(screen) {
  const g = game();
  const card = el("div", "card");
  card.appendChild(el("h2", null, "Résultats"));
  const days = revealedDays();
  if (!days.length) {
    card.appendChild(el("p", "muted",
      "Aucune journée révélée pour l'instant. Les votes restent secrets jusqu'au reveal du soir."));
    return screen.appendChild(card);
  }

  const select = document.createElement("select");
  for (const d of days) {
    const o = el("option", null, "Journée " + d); o.value = String(d);
    select.appendChild(o);
  }
  select.value = String(S.resultDay && days.includes(S.resultDay) ? S.resultDay : days[0]);
  const body = el("div");
  select.onchange = () => { S.resultDay = Number(select.value); paintDay(); };
  card.append(el("label", null, "Journée"), select, body);

  function paintDay() {
    const day = Number(select.value);
    clear(body);
    const votes = votesOfDay(day);
    const found = [...S.secrets.values()].filter((s) => s.solvedDay === day);

    if (found.length) {
      body.appendChild(el("h3", null, "Secrets démasqués ce jour-là"));
      for (const s of found) {
        const box = el("div", "secret flat solved");
        box.appendChild(el("span", "stamp", "Démasqué"));
        box.appendChild(el("span", "code", "Secret " + s.code));
        box.appendChild(el("span", "txt", s.text));
        const author = S.players.get(s.owner);
        box.appendChild(el("span", "who", "C'était " + (author ? author.name : "?")));
        body.appendChild(box);
      }
    }

    if (iFoundOn(day)) celebrate(day);
    body.appendChild(el("h3", null, "Tous les votes (" + votes.length + ")"));
    if (!votes.length) body.appendChild(el("p", "muted", "Personne n'a voté ce jour-là."));
    for (const v of votes) {
      const secret = S.secrets.get(v.secret);
      const voter = S.players.get(v.voter);
      const guessed = S.players.get(v.guess);
      const correct = secret && v.guess === secret.owner;
      const row = el("div", "vote" + (correct ? " hit" : ""));
      row.appendChild(el("p", null,
        (voter ? voter.name : "?") + " a attribué le secret " + (secret ? secret.code : "?") +
        " à " + (guessed ? guessed.name : "?")));
      if (secret) row.appendChild(el("p", "muted", "« " + secret.text + " »"));
      // Un vote raté ne nomme jamais l'auteur d'un secret encore en jeu.
      let verdict;
      if (correct) {
        verdict = "Trouvé ! +" + g.pointsCorrect + " pour " + (voter ? voter.name : "?");
      } else if (secret && (secret.solvedDay != null || g.phase === "fini")) {
        const author = S.players.get(secret.owner);
        verdict = "Raté — c'était " + (author ? author.name : "?") + " (+" + g.pointsWrong + " pour " + (author ? author.name : "?") + ")";
      } else {
        verdict = "Raté — ce n'est pas " + (guessed ? guessed.name : "?") + ". +" + g.pointsWrong + " pour l'auteur, qui reste dans l'ombre.";
      }
      row.appendChild(el("span", "pill" + (correct ? "" : " bad"), verdict));
      body.appendChild(row);
    }
  }
  paintDay();
  screen.appendChild(card);
}

/** Ton vote de cette journée était-il le bon ? */
function iFoundOn(day) {
  const v = myVote(day);
  if (!v) return false;
  const secret = S.secrets.get(v.secret);
  return !!secret && v.guess === secret.owner;
}

/* --------------------------------------------------------- classement */
function renderRanking(screen) {
  const g = game();
  const card = el("div", "card");
  card.appendChild(el("h2", null, "Classement"));
  card.appendChild(el("p", "muted",
    "+" + g.pointsCorrect + " par bonne réponse, +" + g.pointsWrong + " par personne trompée par ton secret."));
  const rows = leaderboard();
  if (!rows.length) card.appendChild(el("p", "muted", "Personne dans la partie."));
  rows.forEach((r, i) => {
    const row = el("div", "rank" + (i < 3 ? " p" + (i + 1) : "") +
                             (r.key === S.meKey ? " me" : ""));
    row.appendChild(el("div", "pos", String(i + 1)));
    const who = el("div", "who", r.name);
    who.appendChild(el("small", null,
      plural(r.found, "secret trouvé", "secrets trouvés") + " · " +
      plural(r.fooled, "personne trompée", "personnes trompées")));
    row.appendChild(who);
    row.appendChild(el("div", "pts", r.points + (Math.abs(r.points) > 1 ? " pts" : " pt")));
    card.appendChild(row);
  });
  screen.appendChild(card);
}

/* ---------------------------------------------------------- animateur */
function renderAnim(screen) {
  const g = game();
  if (!S.isAnim) {
    const card = el("div", "card");
    card.appendChild(el("h2", null, "Espace animateur"));
    card.appendChild(el("p", "muted", g.animHash
      ? "Entre le mot de passe animateur pour piloter les journées."
      : "Personne n'a encore pris le rôle d'animateur. Le mot de passe que tu choisis ici sera le mot de passe animateur de la partie."));
    const form = el("form");
    const pass = document.createElement("input");
    pass.type = "password"; pass.autocomplete = "current-password";
    const btn = el("button", "btn full", g.animHash ? "Entrer" : "Devenir animateur");
    form.append(el("label", null, "Mot de passe animateur"), pass, btn);
    form.onsubmit = async (e) => {
      e.preventDefault();
      btn.disabled = true;
      try { const note = await animLogin(pass.value); render(true); if (note) say("animMsg", note, "ok"); }
      catch (err) { say("animMsg", err.message); btn.disabled = false; }
    };
    card.appendChild(form);
    const msg = el("div"); msg.id = "animMsg"; card.appendChild(msg);
    return screen.appendChild(card);
  }

  const pilot = el("div", "card");
  pilot.appendChild(el("h2", null, "Pilotage de la partie"));
  const withSecret = S.secrets.size;
  const voted = g.roundStatus === "open" ? votesOfDay(g.day).length : 0;
  const table = el("table");
  const rows = [
    ["Inscrits", String(S.players.size)],
    ["Secrets déposés", withSecret + " / " + S.players.size],
    ["Secrets démasqués", [...S.secrets.values()].filter((s) => s.solvedDay != null).length + " / " + withSecret],
  ];
  if (g.roundStatus === "open") rows.push(["Votes de la journée " + g.day, voted + " / " + withSecret]);
  for (const [k, v] of rows) {
    const tr = el("tr"); tr.append(el("th", null, k), el("td", null, v)); table.appendChild(tr);
  }
  pilot.appendChild(table);

  const actions = el("div", "row");
  function action(label, cls, enabled, fn, confirmText) {
    const b = el("button", "btn small " + cls, label);
    b.disabled = !enabled;
    b.onclick = async () => {
      if (confirmText && !confirm(confirmText)) return;
      b.disabled = true;
      say("pilotMsg", "");
      try { await fn(); say("pilotMsg", label + " : c'est fait.", "ok"); }
      catch (err) { say("pilotMsg", err.message); b.disabled = false; }
    };
    actions.appendChild(b);
  }
  action("Lancer la partie", "", g.phase === "lobby", startGame,
    "Lancer la partie ? Les secrets seront verrouillés et la journée 1 ouverte.");
  action("Clôturer & révéler", "", g.roundStatus === "open", closeDay,
    "Clôturer la journée ? Tous les votes du jour deviennent publics et les points sont attribués.");
  action("Ouvrir la journée suivante", "ghost", g.phase === "jeu" && g.roundStatus === "closed", openNextDay);
  action("Terminer la partie", "ghost", g.phase !== "fini", endGame,
    "Terminer la partie ? Tous les secrets restants seront révélés.");
  pilot.appendChild(actions);
  const pmsg = el("div"); pmsg.id = "pilotMsg"; pilot.appendChild(pmsg);
  screen.appendChild(pilot);

  // Participants — le texte des secrets est visible ici pour la modération.
  const people = el("div", "card");
  people.appendChild(el("h2", null, "Participants"));
  people.appendChild(el("p", "muted", "Tu vois les secrets avec leur auteur, pour pouvoir modérer et animer le reveal."));
  for (const p of [...S.players.values()].sort((a, b) => a.name.localeCompare(b.name, "fr"))) {
    const s = S.secrets.get(p.key);
    const box = el("div", "secret flat");
    const head = el("p");
    head.appendChild(el("strong", null, p.name));
    head.appendChild(document.createTextNode(" "));
    head.appendChild(el("span", s ? "pill" : "pill bad", s ? "Secret " + s.code : "Pas de secret"));
    if (s && s.solvedDay != null) head.appendChild(el("span", "pill grey", " démasqué "));
    if (g.roundStatus === "open" && S.votes.some((v) => v.day === g.day && v.voter === p.key)) {
      head.appendChild(el("span", "pill", " a voté "));
    }
    box.appendChild(head);
    if (s) box.appendChild(el("span", "txt", s.text));
    const del = el("button", "btn small bad", "Retirer");
    del.onclick = async () => {
      if (!confirm("Retirer " + p.name + " ? Son secret et ses votes seront effacés.")) return;
      try { await removePlayer(p.key); } catch (err) { alert(err.message); }
    };
    box.appendChild(del);
    people.appendChild(box);
  }
  screen.appendChild(people);

  // Réglages
  const settings = el("div", "card");
  settings.appendChild(el("h2", null, "Réglages"));
  const form = el("form");
  const nameIn = document.createElement("input"); nameIn.type = "text"; nameIn.value = g.name; nameIn.maxLength = 40;
  const okIn = document.createElement("input"); okIn.type = "number"; okIn.min = "0"; okIn.max = "100"; okIn.value = String(g.pointsCorrect);
  const koIn = document.createElement("input"); koIn.type = "number"; koIn.min = "0"; koIn.max = "100"; koIn.value = String(g.pointsWrong);
  const save = el("button", "btn full", "Enregistrer");
  form.append(el("label", null, "Nom de la partie"), nameIn,
              el("label", null, "Points pour une bonne réponse"), okIn,
              el("label", null, "Points pour l'auteur, par personne trompée"), koIn, save);
  form.onsubmit = async (e) => {
    e.preventDefault();
    save.disabled = true;
    try {
      await setRules({
        name: nameIn.value.trim() || "Secret BAFA",
        pointsCorrect: Math.max(0, Math.min(100, Math.round(Number(okIn.value) || 0))),
        pointsWrong: Math.max(0, Math.min(100, Math.round(Number(koIn.value) || 0))),
      });
      say("setMsg", "Réglages enregistrés.", "ok");
    } catch (err) { say("setMsg", err.message); }
    save.disabled = false;
  };
  settings.appendChild(form);
  const smsg = el("div"); smsg.id = "setMsg"; settings.appendChild(smsg);

  settings.appendChild(el("h3", null, "Zone rouge"));
  const danger = el("div", "row");
  const softReset = el("button", "btn small ghost", "Nouvelle partie (garder les comptes)");
  softReset.onclick = async () => {
    if (!confirm("Les votes, journées et points sont effacés. Comptes et secrets conservés. Continuer ?")) return;
    try { await resetGame(true); say("setMsg", "Nouvelle partie prête.", "ok"); } catch (err) { say("setMsg", err.message); }
  };
  const hardReset = el("button", "btn small bad", "Tout effacer");
  hardReset.onclick = async () => {
    if (!confirm("TOUT effacer : comptes, secrets, votes et points. Irréversible.")) return;
    if (!confirm("Dernière confirmation : on efface vraiment tout ?")) return;
    try { await resetGame(false); say("setMsg", "Tout a été effacé.", "ok"); } catch (err) { say("setMsg", err.message); }
  };
  danger.append(softReset, hardReset);
  settings.appendChild(danger);

  const out = el("button", "btn small ghost", "Quitter le rôle animateur");
  out.onclick = () => { S.isAnim = false; forget(LS_ANIM); render(true); };
  settings.appendChild(el("h3", null, "Session"));
  settings.appendChild(out);
  screen.appendChild(settings);
}

/* ═══════════════════════════════════════════════════════ démarrage ═══ */
S.isAnim = recall(LS_ANIM) === "1";
S.resultDay = null;
boot();
</script>
