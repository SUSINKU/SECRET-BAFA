<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secret BAFA</title>
<meta name="description" content="Le jeu des secrets pour les formations BAFA : un secret par stagiaire, un vote par jour, un reveal le soir.">
<meta name="theme-color" content="#8B5CF6">
<link rel="icon" href="images/logo-secret-bafa.png">
<link rel="apple-touch-icon" href="images/logo-secret-bafa.png">
<link rel="preload" as="font" type="font/woff2" href="fonts/poppins-800-latin.woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="hero" id="hero">
  <div class="hero__blobs" aria-hidden="true"><i></i><i></i></div>
  <div class="hero__inner">
    <div class="brand">
      <span class="brand__mark">🤫</span>
      <span id="gameName">Secret BAFA</span>
    </div>
    <div class="hero__pill" id="statusLine">Chargement…</div>
    <h1 id="heroTitle"></h1>
    <p class="hero__sub" id="heroSub"></p>
    <div class="hero__stats" id="heroStats"></div>
    <div class="progress hidden" id="heroProgress">
      <div class="progress__track"><div class="progress__fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress__label" id="progressLabel"></div>
    </div>
  </div>
</header>

<nav class="tabs hidden" id="tabs" aria-label="Sections du jeu"></nav>

<main class="wrap">
  <div id="screen">
    <div class="card"><h2>Chargement…</h2><p class="muted">On récupère l'état de la partie.</p></div>
  </div>
</main>

<footer>Un secret, ça reste dans la formation.</footer>

<script src="js/app.js"></script>
</body>
</html>
