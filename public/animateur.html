<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret BAFA — Animateur</title>
<link rel="icon" href="images/logo-secret-bafa.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <img src="images/logo-secret-bafa.png" alt="Secret BAFA">
  <h1>Espace animateur</h1>
  <div class="sub" id="phaseLine">Réservé au formateur</div>
</header>

<main class="wrap">
  <!-- Connexion -->
  <section class="card" id="loginCard">
    <h2>Connexion animateur</h2>
    <form id="adminLoginForm">
      <label for="adminPassword">Mot de passe animateur</label>
      <input type="password" id="adminPassword" autocomplete="current-password" required>
      <button class="btn full" type="submit">Entrer</button>
    </form>
    <div id="loginMessage"></div>
    <p class="muted">Par défaut&nbsp;: <code>bafa2026</code> — change-le dans les réglages dès la première connexion.</p>
    <p class="center"><a href="index.html" class="muted">← Retour au jeu</a></p>
  </section>

  <div id="console" class="hidden">
    <div id="adminBanner"></div>

    <!-- Pilotage -->
    <section class="card">
      <h2>Pilotage de la partie</h2>
      <div id="pilotState"></div>
      <div class="row">
        <button class="btn" id="btnStart">Lancer la partie (journée 1)</button>
        <button class="btn" id="btnClose">Clôturer la journée &amp; révéler</button>
        <button class="btn" id="btnOpen">Ouvrir la journée suivante</button>
        <button class="btn ghost" id="btnEnd">Terminer la partie</button>
      </div>
      <div id="pilotMessage"></div>
    </section>

    <!-- Reveal -->
    <section class="card" id="revealCard">
      <h2>Dernier reveal</h2>
      <div id="revealBody"></div>
    </section>

    <!-- Participants -->
    <section class="card">
      <h2>Participants</h2>
      <p class="muted" id="playersSummary"></p>
      <div id="playersList"></div>
    </section>

    <!-- Classement -->
    <section class="card">
      <h2>Classement</h2>
      <div id="adminRanking"></div>
    </section>

    <!-- Réglages -->
    <section class="card">
      <h2>Réglages</h2>
      <form id="settingsForm">
        <label for="setName">Nom de la partie</label>
        <input type="text" id="setName" maxlength="60">
        <label for="setCorrect">Points pour une bonne réponse</label>
        <input type="number" id="setCorrect" min="0" max="100" step="1">
        <label for="setWrong">Points pour l'auteur, par personne trompée</label>
        <input type="number" id="setWrong" min="0" max="100" step="1">
        <label for="setPassword">Nouveau mot de passe animateur (laisser vide pour garder l'actuel)</label>
        <input type="password" id="setPassword" autocomplete="new-password">
        <button class="btn full" type="submit">Enregistrer les réglages</button>
      </form>
      <div id="settingsMessage"></div>
      <h3>Zone rouge</h3>
      <div class="row">
        <button class="btn ghost" id="btnResetKeep">Nouvelle partie (garder les comptes)</button>
        <button class="btn danger" id="btnResetAll">Tout effacer</button>
      </div>
      <p class="center" style="margin-top:16px"><button class="btn ghost small" id="adminLogout">Quitter l'espace animateur</button></p>
    </section>
  </div>
</main>

<footer>Secret BAFA — espace animateur</footer>

<script src="js/common.js"></script>
<script src="js/animateur.js"></script>
</body>
</html>
