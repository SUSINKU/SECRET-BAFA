# Déploiement sur Render (https://render.com) — « Blueprint ».
#
# Le plan « starter » est payant (quelques euros par mois) mais c'est le premier
# qui autorise un disque persistant, et la partie vit dans un fichier SQLite :
# sur le plan gratuit, le service s'endort et redémarre, et la partie repart de
# zéro au milieu de la formation. Voir le README pour les autres options.
services:
  - type: web
    name: secret-bafa
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: SECURE_COOKIES
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false   # à saisir dans l'interface Render : c'est ton mot de passe animateur
    disk:
      name: secret-bafa-data
      mountPath: /var/data
      sizeGB: 1
