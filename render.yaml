# Déploiement sur Render (https://render.com) — « Blueprint ».
#
# La partie ne vit plus dans un fichier : elle est dans une base libSQL hébergée
# (Turso). Le serveur n'a donc besoin d'aucun disque persistant, et l'offre
# gratuite de Render suffit. Voir le README pour créer la base.
#
# Seule contrepartie du plan gratuit : au bout d'un quart d'heure sans visite,
# Render endort le service. La personne suivante attend une trentaine de
# secondes le temps du réveil — mais rien n'est perdu, tout est dans la base.
services:
  - type: web
    name: secret-bafa
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SECURE_COOKIES
        value: "1"
      # Les trois valeurs ci-dessous se saisissent dans l'interface de Render,
      # elles n'ont rien à faire dans le dépôt.
      - key: DATABASE_URL
        sync: false        # libsql://<ta-base>.turso.io
      - key: DATABASE_AUTH_TOKEN
        sync: false        # le jeton fourni par Turso
      - key: ADMIN_PASSWORD
        sync: false        # ton mot de passe animateur
